# /etc/nginx/sites-available/app.edutechnd.io.vn
# Reverse proxy cho ứng dụng Document Converter chạy trong Docker (port 3000 localhost).
# Sau khi `certbot --nginx -d app.edutechnd.io.vn` chạy, certbot sẽ tự thêm block listen 443 SSL.

server {
    listen 80;
    listen [::]:80;
    server_name app.edutechnd.io.vn;

    # File upload tối đa 60MB (đồng bộ với backend MAX_UPLOAD_SIZE 50MB + buffer)
    client_max_body_size 60M;

    # Tăng timeout cho OCR (model lần đầu load lâu, PDF nhiều trang)
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Log riêng cho subdomain này
    access_log /var/log/nginx/app.edutechnd.io.vn.access.log;
    error_log  /var/log/nginx/app.edutechnd.io.vn.error.log;

    # Gzip cho asset tĩnh
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Bảo mật cơ bản
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # Cho phép certbot xác thực HTTP-01 challenge (Let's Encrypt webroot fallback)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
