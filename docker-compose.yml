services:
  backend:
    build:
      context: ./backend
    container_name: doc-converter-backend
    restart: unless-stopped
    environment:
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - GEMINI_MAX_CONCURRENT_PER_KEY=${GEMINI_MAX_CONCURRENT_PER_KEY:-3}
      - GEMINI_RETRY_ATTEMPTS=${GEMINI_RETRY_ATTEMPTS:-3}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-120}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
    container_name: doc-converter-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-net
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-network}"

      # HTTPS router — Traefik đã tự redirect HTTP→HTTPS ở entrypoint `web`
      - "traefik.http.routers.doc-converter.rule=Host(`${APP_DOMAIN:-app.edutechnd.io.vn}`)"
      - "traefik.http.routers.doc-converter.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.doc-converter.tls=true"
      - "traefik.http.routers.doc-converter.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"

      # Service: trỏ về cổng 80 của container frontend (nginx serve SPA + proxy /api → backend)
      - "traefik.http.services.doc-converter.loadbalancer.server.port=80"

      # Cho phép upload file lớn (50MB + buffer = 60MB)
      - "traefik.http.middlewares.doc-converter-bodylimit.buffering.maxRequestBodyBytes=62914560"
      - "traefik.http.middlewares.doc-converter-bodylimit.buffering.memRequestBodyBytes=10485760"
      - "traefik.http.routers.doc-converter.middlewares=doc-converter-bodylimit"

networks:
  app-net:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-network}

